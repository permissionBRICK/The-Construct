# Spool for `construct notify` — desktop notifications queued for the Windows host.
#
# /run is tmpfs, which is the point: a VM reboot must not replay yesterday's
# messages. systemd-tmpfiles recreates the directory on every boot, so the CLI
# never has to (and a non-root user on the VM can still queue).
#
# 1777 = world-writable + sticky, like /tmp: anyone may add an entry, nobody may
# clobber someone else's. The host extension claims entries with an atomic rename.
d /run/construct 0755 root root -
d /run/construct/notify 1777 root root -
