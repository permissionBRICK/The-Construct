name: Construct release
# main publishes the stable release (latest). rework (until it merges into main) and nightly
# publish prereleases and replace the nightly channel manifest (docs/release-flow.md).
on:
  push:
    branches: [main, rework, nightly]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: construct-release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rework' || github.ref == 'refs/heads/nightly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Channel and version
        id: build
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then echo channel=stable; else echo channel=nightly; fi >> "$GITHUB_OUTPUT"
          echo "version=$(python3 scripts/release.py version)" >> "$GITHUB_OUTPUT"
      - run: dotnet publish service/src/Constructd.Api -c Release -r win-x64 --self-contained true -p:InformationalVersion=${{ steps.build.outputs.version }}+${{ github.sha }} -p:IncludeSourceRevisionInInformationalVersion=false -o /tmp/host-publish
      - run: dotnet publish service/src/Constructd.Api -c Release -r win-x64 --self-contained false -p:InformationalVersion=${{ steps.build.outputs.version }}+${{ github.sha }} -p:IncludeSourceRevisionInInformationalVersion=false -o /tmp/host-publish-fdd
      # The Linux service for Proxmox hosts (docs/proxmox-host.md); install-construct-host.sh downloads it.
      - run: dotnet publish service/src/Constructd.Api -c Release -r linux-x64 --self-contained true -p:InformationalVersion=${{ steps.build.outputs.version }}+${{ github.sha }} -p:IncludeSourceRevisionInInformationalVersion=false -o /tmp/host-publish-linux
      - name: Package pinned commit
        shell: pwsh
        run: ./service/host/New-ConstructHostPackage.ps1 -PublishDir /tmp/host-publish -FrameworkDependentPublishDir /tmp/host-publish-fdd -LinuxPublishDir /tmp/host-publish-linux -OutputDir /tmp/host-release -Commit "${{ github.sha }}" -Repository "$env:GITHUB_REPOSITORY"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The device agent (agent/): Windows x64 tray app and Linux x64 host, each with the UI bundle;
      # the next step lists both in the channel manifest with their SHA-256.
      - name: Package the device agent
        run: python3 scripts/package-agent.py --output /tmp/host-release --commit "$GITHUB_SHA" --version "${{ steps.build.outputs.version }}"
      - name: Package source and generate shared manifest
        run: python3 scripts/package-construct-release.py --output /tmp/host-release --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --channel "${{ steps.build.outputs.channel }}" --version "${{ steps.build.outputs.version }}"
      - name: Nightly notes, everything not yet on main
        if: steps.build.outputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py notes --base origin/main --head "$GITHUB_SHA" > /tmp/release-notes.md
      - name: Publish complete release and advance latest (stable) or the nightly channel
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.build.outputs.channel }}
        run: |
          if [ "$CHANNEL" = nightly ]; then
            python3 scripts/publish-construct-release.py /tmp/host-release --channel nightly --notes-file /tmp/release-notes.md
          else
            python3 scripts/publish-construct-release.py /tmp/host-release
          fi
