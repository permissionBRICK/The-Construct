name: Construct release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: construct-release-main
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish service/src/Constructd.Api -c Release -r win-x64 --self-contained true -p:InformationalVersion=1.0.0+${{ github.sha }} -p:IncludeSourceRevisionInInformationalVersion=false -o /tmp/host-publish
      - run: dotnet publish service/src/Constructd.Api -c Release -r win-x64 --self-contained false -p:InformationalVersion=1.0.0+${{ github.sha }} -p:IncludeSourceRevisionInInformationalVersion=false -o /tmp/host-publish-fdd
      - name: Package pinned commit
        shell: pwsh
        run: ./service/host/New-ConstructHostPackage.ps1 -PublishDir /tmp/host-publish -FrameworkDependentPublishDir /tmp/host-publish-fdd -OutputDir /tmp/host-release -Commit "${{ github.sha }}" -Repository "$env:GITHUB_REPOSITORY"
      - name: Decide which Companion release this commit installs
        id: companion
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(python3 scripts/companion-release-plan.py --commit "$GITHUB_SHA" | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag"])')" >> "$GITHUB_OUTPUT"
      - name: Package source and generate shared manifest
        run: python3 scripts/package-construct-release.py --output /tmp/host-release --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --companion-release-tag "${{ steps.companion.outputs.tag }}"
      - name: Publish complete release and advance latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-construct-release.py /tmp/host-release
