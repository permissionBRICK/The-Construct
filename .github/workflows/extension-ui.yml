name: Control panel regressions
on:
  push:
    branches: [main]
    paths: ['extension/**', '.github/workflows/extension-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guest actions and independent inventory loading
        run: |
          node extension/test/guest-console.test.js
          node extension/test/hostadmin.test.js
          node extension/test/hostadmin-ui.test.js
          node extension/test/hostadmin-discovery.test.js
      - run: npm install
        working-directory: extension/test
      - run: npx playwright install --with-deps chromium
        working-directory: extension/test
      - name: Browser layout and interactions
        run: node extension/test/ui-smoke.js
        env:
          UI_SMOKE_THEME: native
