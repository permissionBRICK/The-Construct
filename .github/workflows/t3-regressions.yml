name: T3 provisioning regressions
on:
  push:
    branches: [main]
    paths:
      - 'Provision-AgentVM.ps1'
      - 'Get-ConstructT3PairingLink.ps1'
      - 'extension/vm/construct-t3-pairing-base.sh'
      - 'extension/src/t3code.js'
      - 'extension/test/t3code.test.js'
      - 'lib/AgentVm.Common.ps1'
      - 'extension/vm/construct-t3park-patch.mjs'
      - 'bin/build-t3code.sh'
      - 'bin/t3code-build-source.py'
      - 'bin/install-t3code-prebuilt.py'
      - 'bin/install-ai-tools.sh'
      - 'extension/src/updates.js'
      - 'extension/test/updates.test.js'
      - 'test/t3*'
      - '.github/workflows/t3-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-host:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Test Windows PowerShell 5.1 download, saved settings and console detachment
        shell: powershell
        run: node test/t3-reprovision-host.test.mjs
      - name: Test installer handoff and shared host cache
        shell: powershell
        run: ./test/t3-desktop-handoff.test.ps1
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python3 test/t3-install-source.test.py
      - run: python3 test/t3-prebuilt.test.py
      - run: python3 test/t3-build-source.test.py
      - run: node extension/test/updates.test.js
      - run: node extension/test/t3code.test.js
      - run: python3 test/t3-pairing-forward.test.py
