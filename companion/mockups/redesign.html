<div class="design-tools"><div class="design-switch" aria-label="Design direction"><button data-design="workspace" class="active">01 Workspace</button><button data-design="desk">02 Desk</button><button data-design="fleet">03 Fleet</button></div><div class="row"><small class="muted" style="background:var(--card);padding:6px 9px;border-radius:6px">Interactive studies · sample data</small><button class="btn small" data-action="reset">Reset demo</button></div></div>
<p class="design-caption" id="designCaption"></p>
<div id="app" class="app workspace"></div>
<div id="notes" class="flow-notes"></div>
<script>
// Standalone design study. All state is in memory; no Companion APIs are called.
'use strict';
const icons={box:'M12 3 3 8v9l9 5 9-5V8L12 3Zm0 9 9-4M12 12 3 8m9 4v10M7.5 5.5l9 5',home:'m3 10 9-7 9 7M5 9v12h14V9M9 21v-7h6v7',machine:'M3 4h18v13H3zM8 21h8m-4-4v4',folder:'M3 6h6l2 3h10v11H3zM3 6V4h6l2 2h9v3',key:'M14 14a6 6 0 1 0-4-4M10 10 2 18v4h4v-3h3v-3h3l2-2',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2',host:'M3 3h18v7H3zM3 14h18v7H3zM6 6.5h1m-1 11h1',activity:'M2 12h5l3-8 4 16 3-8h5',arrow:'M4 12h16m-6-6 6 6-6 6',chevron:'m9 5 7 7-7 7',search:'M15 15 21 21M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14',bell:'M6 9a6 6 0 0 1 12 0v7l2 2H4l2-2V9m4 12h4',check:'m5 12 4 4L19 6',plus:'M12 4v16M4 12h16',close:'m6 6 12 12M6 18 18 6',terminal:'m4 6 5 6-5 6m8 0h8',play:'m7 4 14 8-14 8V4',power:'M12 2v10M6 5a9 9 0 1 0 12 0',refresh:'M20 7v5h-5M4 17v-5h5M5 7a8 8 0 0 1 14-2l1 7M4 12l1 7a8 8 0 0 0 14-2',shield:'m12 2 9 4v6c0 6-9 10-9 10S3 18 3 12V6l9-4Zm-4 10 3 3 5-6',link:'m10 14 4-4M8 16l-2 2a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0m2 1 2-2a4 4 0 0 1 6 6l-5 5a4 4 0 0 1-6 0',update:'M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5',mic:'M9 3h6v10H9zM5 10v3a7 7 0 0 0 14 0v-3M12 20v3',tray:'M4 5h16v15H4zM4 14h5l1 3h4l1-3h5',clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18m0 4v5l3 2',chart:'M4 20h17M6 16v-4m6 4V4m6 12V8',users:'M8 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8M1 21v-3a7 7 0 0 1 14 0v3m1-17a4 4 0 0 1 0 8m3 3a5 5 0 0 1 4 5',help:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M9 9a3 3 0 1 1 5 2c-2 1-2 2-2 3m0 3h.01'};
const I=(name,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[name]||icons.box}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const B=(label,action,cls='',icon='')=>`<button class="btn ${cls}" data-action="${action}">${icon?I(icon):''}${label}</button>`;
const nav=(label,page,icon)=>`<button class="nav-btn ${state.page===page?'active':''}" data-page="${page}" ${state.page===page?'aria-current="page"':''}>${I(icon)}<span>${label}</span>${page==='inbox'&&pending()?`<span class="count">${pending()}</span>`:''}</button>`;

 if(state.settingsTab==='about')body=`<h2>Companion</h2><p class="muted gap">A workspace for your coding VMs.</p><div class="setting"><span>Connection</span>${badge('Healthy','good')}</div><div class="setting"><span>Update channel</span><span>Stable</span></div><div class="row wrap gap">${B('View updates','updates','small')}${B('Open logs','logs','small')}${B('Run diagnostics','diagnostics','small')}</div>`;

function vmSettings(){

 if(state.vmTab==='resources')content=`${state.hardwarePending?`<div class="notice"><div class="grow"><strong>Hardware changes are pending</strong><p>Stop and start ${state.vm} to apply them.</p></div>${B('Review restart','restart','small')}</div>`:''}<div class="panel"><div class="panel-head"><h3>Hardware</h3>${badge('Stop / start required','warn')}</div><div class="setting"><div><label for="ram"><strong>Memory</strong></label><p>Available host capacity: 40 GB</p></div><span class="row"><input type="number" id="ram" min="2" max="48" value="${state.ram}">GB</span></div><div class="setting"><div><label for="cpu"><strong>Processors</strong></label><p>Maximum allocation: 16 cores</p></div><span class="row"><input type="number" id="cpu" min="1" max="16" value="${state.cpu}">cores</span></div><div class="setting"><div><strong>Disk</strong><p>Disk size is chosen during a rebuild.</p></div><span>120 GB ${B('Change','rebuild','small quiet')}</span></div><div class="savebar"><span>Saving keeps the VM running.</span>${B('Save hardware','save-hardware','primary small')}</div></div><div class="panel gap"><div class="panel-head"><h3>When idle</h3>${badge('Applies immediately','good')}</div><div class="setting"><div><label for="idle"><strong>Shut down after</strong></label><p>Active agent work keeps the VM awake.</p></div><span class="row"><input type="number" id="idle" min="0" max="10080" value="${state.idle}">min</span></div><div class="row between"><small>0 means never shut down automatically.</small>${B('Apply','save-idle','small')}</div></div>`;
 if(state.vmTab==='services')content=`<div class="panel"><div class="panel-head"><h3>Coding tools</h3>${B('Manage updates','updates','small quiet')}</div>${['T3 Code','Claude Code','Codex','OpenCode'].map(a=>`<div class="setting"><span>${a}</span>${badge('Installed','good')}</div>`).join('')}</div><div class="panel gap"><h3>Access & services</h3>${['VS Code web','VS Code tunnel','SMB workspace share','Patched T3 Code'].map((t,i)=>`<div class="setting"><div><strong>${t}</strong><p>Applies on reprovision.</p></div>${toggle('service-'+i,true,t)}</div>`).join('')}<div class="gap">${B('Review & reprovision','reprovision','primary')}</div></div>`;
 if(state.vmTab==='maintenance')content=`<div class="panel"><div class="list-row"><span class="tile-icon">${I('refresh')}</span><div class="grow"><strong>Reprovision</strong><p>Run setup again. Keep the VM's files and projects.</p></div>${B('Review','reprovision','small')}</div><div class="list-row"><span class="tile-icon">${I('update')}</span><div class="grow"><strong>Rebuild this VM</strong><p>Choose an image and what to restore.</p></div>${B('Plan rebuild','rebuild','small')}</div><div class="list-row"><span class="tile-icon">${I('activity')}</span><div class="grow"><strong>Logs & diagnostics</strong><p>Inspect recent jobs and connection problems.</p></div>${B('Open logs','logs','small')}</div></div><div class="panel gap"><h3>Remove from Companion</h3><p class="muted" style="font-size:12px;margin:9px 0 15px">Forget this machine on this PC. The VM and its files remain on the host.</p>${B('Remove registration','remove-machine','danger small')}</div>`;
 return header('Machines / '+state.vm,state.vm,'Changes always show their target and when they apply.')+tabs(tabsList,state.vmTab,'vm-tab')+content;
}
function hosts(){
 const sections=[['overview','Overview'],['vms','VMs'],['users','Users'],['media','Images & media'],['jobs','Jobs & audit'],['config','Configuration']];
 let body='';
 if(state.hostTab==='overview')body=`<div class="grid2"><div class="panel"><div class="panel-head"><h3>primary-host</h3>${badge('Healthy','good')}</div><p class="muted" style="font-size:12px">Proxmox · administrator access</p><div class="setting"><span>Memory allocated</span><strong>24 / 64 GB</strong></div><div class="meter"><span style="width:37.5%"></span></div><div class="setting"><span>Virtual machines</span><span>2 registered</span></div><div class="setting"><span>Active jobs</span><span>None</span></div>${B('Host updates','updates','small quiet')}</div><div class="panel"><h3>Local computer</h3><p class="muted" style="font-size:12px;margin:10px 0">Hyper-V · local VMs</p><div class="setting"><span>Memory allocated</span><strong>8 / 32 GB</strong></div><div class="meter"><span style="width:25%"></span></div><p class="muted" style="font-size:12px;margin:20px 0">Share this computer to let other users create and manage VMs.</p>${B('Set up hosting','host-setup','small')}</div></div>`;
 if(state.hostTab==='vms')body=`<div class="panel">${machineTable()}</div><div class="gap">${B('Create VM','new-vm','primary small','plus')}</div>`;
 if(state.hostTab==='users')body=`<div class="panel"><div class="panel-head"><h3>Users on primary-host</h3>${B('Register user','add-user','small','plus')}</div><div class="table-wrap"><table class="table"><thead><tr><th>User</th><th>Role</th><th>Memory limit</th><th></th></tr></thead><tbody><tr><td>operator</td><td>Administrator</td><td>48 GB</td><td>${B('Edit','edit-user','small quiet')}</td></tr><tr><td>developer</td><td>Member</td><td>16 GB</td><td>${B('Edit','edit-user','small quiet')}</td></tr></tbody></table></div></div>`;
 if(state.hostTab==='media')body=`<div class="panel"><h3>Installation images</h3>${[['Construct Ubuntu','Primary VM image · ready'],['Windows evaluation','Child VM media · unused']].map(([n,d])=>`<div class="list-row"><span class="tile-icon">${I('box')}</span><div class="grow"><strong>${n}</strong><p>${d}</p></div>${B('Details','media-detail','small quiet')}</div>`).join('')}</div><div class="grid2 gap"><div class="panel"><h3>Windows guests</h3><p class="muted" style="font-size:12px;margin:10px 0 15px">License keys and activation assignments.</p>${B('Manage licenses','licenses','small')}</div><div class="panel"><h3>Unused media</h3><p class="muted" style="font-size:12px;margin:10px 0 15px">1 unbound image can be removed.</p>${B('Review cleanup','media-cleanup','small')}</div></div>`;
 if(state.hostTab==='jobs')body=`<div class="panel"><h3>Jobs & audit</h3>${timeline()}<div class="gap">${B('Open host logs','logs','small')}</div></div>`;
 if(state.hostTab==='config')body=`<div class="panel"><h3>Host configuration</h3><div class="setting"><div><strong>Capacity policy</strong><p>Reserve host memory before allocating VMs.</p></div><select aria-label="Capacity policy" data-pref="capacity"><option>Enforce limits</option><option>Observe only</option></select></div><div class="setting"><div><strong>Host reserve</strong><p>Memory reserved for the host.</p></div><span class="row"><input type="number" aria-label="Host reserve" value="8" min="2">GB</span></div><div class="setting"><span>Backend capabilities</span>${badge('Proxmox')}</div><div class="savebar"><span>Target: primary-host</span>${B('Save changes','save-host','primary small')}</div></div>`;
 return header('Infrastructure / administration','Hosts','Primary-host selected · administrator',B('Connect host','new-host','primary','plus'))+tabs(sections,state.hostTab,'host-tab')+body;
}
function timeline(limit=6){let entries=[...state.activity.map(t=>[t,'Just now']),['Configuration profiles synchronized','3 minutes ago · dev-main'],['Agent tools updated','18 minutes ago · dev-main'],['VM started','1 hour ago · local-sandbox'],['Secret access released and cleaned up','2 hours ago · dev-main']];return `<div class="timeline">${entries.slice(0,limit).map(([t,d])=>`<div>${esc(t)}<small>${d}</small></div>`).join('')}</div>`}
function activity(){return header('Across all machines','Activity','Jobs, access decisions and connection events.',B('Open logs','logs','quiet','terminal'))+`<div class="panel"><div class="panel-head"><h3>Recent activity</h3>${badge('Live','good')}</div>${timeline(10)}</div>`}
function usage(){const daily=state.period==='day';const vals=daily?[14,22,18,29,13,21,9]:[22,36,28,45,31,57,41];return header('Across all machines','Usage','Sample token counts and estimated API-equivalent costs.',B('Export JSON','export-usage','quiet','update'))+tabs([['day','Today'],['week','This week']],state.period,'period')+`<div class="grid3 metrics"><div class="panel metric"><small>Total tokens</small><b>${daily?'1.4':'8.6'}M</b></div><div class="panel metric"><small>Estimated cost</small><b>$${daily?'7.20':'42.80'}</b></div><div class="panel metric"><small>Active VMs</small><b>2</b></div></div><div class="panel gap"><div class="panel-head"><h3>${daily?'Tokens by hour':'Tokens by day'}</h3><small>Sample data · relative volume</small></div><div class="chart" role="img" aria-label="Sample token usage bar chart"><span class="screenreader">${vals.join(', ')} relative units.</span>${vals.map((v,i)=>`<div class="column"><span>${v}</span><div class="bar" style="height:${v*1.6}px"></div><span>${daily?['08','10','12','14','16','18','20'][i]:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</span></div>`).join('')}</div></div><div class="panel gap"><div class="table-wrap"><table class="table"><thead><tr><th>Tool</th><th>Tokens</th><th>Estimated cost</th></tr></thead><tbody>${[['Claude Code',daily?'0.7M':'4.3M',daily?'$4.10':'$24.60'],['Codex',daily?'0.5M':'3.1M',daily?'$2.40':'$14.40'],['OpenCode',daily?'0.2M':'1.2M',daily?'$0.70':'$3.80']].map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div><p class="muted gap" style="font-size:11px">Estimates are not your subscription bill. Host administrators can also inspect usage by VM and user.</p>`}
function updates(){return header('Maintenance','Updates','Companion, hosts and VM tools have separate update states.')+`<div class="panel">${[['Companion','This PC',state.updated?'Current':'Update available'],['Construct host','primary-host','Current'],['VM setup','dev-main','Reprovision available'],['Coding agents','dev-main','Current']].map(([n,s,status],i)=>`<div class="list-row"><span class="tile-icon">${I('update')}</span><div class="grow"><strong>${n}</strong><p>${s}</p></div>${badge(status,status==='Current'?'good':'warn')}${B(i===2?'Review':'Details',i===2?'reprovision':i===0?'update-detail':'version-detail','small quiet')}</div>`).join('')}</div><div class="panel gap"><h3>Recent updates</h3>${timeline(3)}</div>`}
function tray(){return header('Companion / desktop','Quick access','A small launcher for everyday actions and a separate approval card.')+`<div class="tray-layout"><div><div class="surface-label">TRAY LAUNCHER</div><div class="tray-popup"><div class="row between"><strong class="row">${I('box')} Construct</strong>${B('Open app','home','small quiet','arrow')}</div><div class="list-row gap"><i class="dot"></i><div class="grow"><strong>${state.vm}</strong><p>Connected · primary-host</p></div>${B('Switch','choose-machine','small quiet')}</div><div class="grid2 gap">${B('T3 Code','launch','primary','arrow')}${B('VS Code','launch-vscode','','terminal')}</div><div class="gap">${B('Web preview · 5173','open-preview','quiet small','link')}</div><div class="setting"><span class="row">${I('mic')}Microphone</span>${toggle('mic',state.mic,'Microphone passthrough')}</div><div class="setting"><span class="row">${I('bell')}Notifications</span>${toggle('notifications',state.notifications,'Notifications')}</div><div class="row between gap">${B('Key vault','vault','small quiet','key')}${B('Preferences','settings','small quiet','settings')}</div></div><p class="tray-caption">Primary tools at the top. The full app handles configuration and maintenance.</p></div><div><div class="surface-label">APPROVAL POP-OUT</div>${state.requests.length?approvalCard(state.requests[0]):`<div class="tray-popup empty">${I('check')}<h3>No requests waiting</h3></div>`}<p class="tray-caption">Appears without stealing focus. Hides while the same request is visible in T3 Desktop.</p></div></div><div class="panel gap"><div class="row between wrap"><div><h3>First time opening Companion</h3><p class="muted" style="font-size:12px;margin-top:5px">Create a local VM, connect a host, or register an existing machine.</p></div>${B('Try first-run setup','onboarding','primary small')}</div></div>`}
function modal(){
 const m=state.modal;let title=m.title||'',body='',footer='',sub='',eyebrow='';
 if(m.kind==='search'){title='Jump to…';body=`<div class="searchbox">${I('search')}<input id="globalSearch" placeholder="Projects, vault, settings…" aria-label="Search Companion" autocomplete="off" autofocus></div><div id="searchResults">${searchResults('')}</div>`;}
 else if(m.kind==='rebuild'){
  eyebrow='Rebuild / '+state.vm;title=['Choose what to rebuild','Choose what to restore','Review this rebuild','Rebuild queued'][m.step];sub=['Start with the installed image or download a fresh one.','Your restoration choice applies only to this rebuild.','Review the target and the data that will be replaced.','The job remains visible after you close this window.'][m.step];
  body=`<div class="steps">${[0,1,2].map(n=>`<span class="${n<=m.step?'on':''}"></span>`).join('')}</div>`;
  if(m.step===0)body+=`<label class="choice"><input type="radio" name="image" value="current" ${m.image==='current'?'checked':''}><span><strong>Current image</strong><small>Reinstall using the image already available.</small></span></label><label class="choice"><input type="radio" name="image" value="fresh" ${m.image==='fresh'?'checked':''}><span><strong>Download fresh image</strong><small>Download the current Ubuntu image, then rebuild.</small></span></label>`;
  if(m.step===1)body+=[['save','Save & restore','Back up configuration, authentication, profiles and supported history now, then restore them.'],['existing','Use an existing backup','Restore the most recent saved configuration backup.'],['wipe','Start empty','Remove everything on this VM without restoring a backup.']].map(([v,t,d])=>`<label class="choice"><input type="radio" name="backup" value="${v}" ${m.backup===v?'checked':''}><span><strong>${t}</strong><small>${d}</small></span></label>`).join('');
  if(m.step===2)body+=`<div class="setting"><span>Machine</span><strong>${state.vm}</strong></div><div class="setting"><span>Image</span><span>${m.image==='fresh'?'Download fresh image':'Current image'}</span></div><div class="setting"><span>Restore</span><span>${m.backup==='save'?'Save & restore':m.backup==='existing'?'Most recent backup':'Nothing'}</span></div><div class="notice gap"><p>The VM disk will be replaced. ${m.backup==='wipe'?'No data will be restored.':'Only supported backup data is restored. Other files on the disk are lost.'} The real flow checks for uncommitted or unpushed work before continuing.</p></div><label class="field">Type ${state.vm} to confirm<input id="confirmVm" autocomplete="off" placeholder="VM name"></label>`;
  if(m.step===3)body+=`<div class="timeline"><div>Rebuild plan accepted<small>Sample job · no machine was changed</small></div><div>Next: save configuration<small>Then replace disk, provision and restore</small></div></div>`;
  footer=m.step===3?B('View activity','finish-rebuild','primary'):B(m.step?'Back':'Cancel',m.step?'wizard-back':'close','quiet')+B(m.step===2?'Rebuild '+state.vm:'Continue',m.step===2?'confirm-rebuild':'wizard-next',m.step===2?'danger':'primary');
 }
 else if(m.kind==='onboarding'){
  eyebrow='Welcome to Construct';title=['How do you want to work?','Connect your machine','Choose your first project','Your workspace is ready'][m.step];
  body=`<div class="steps">${[0,1,2].map(n=>`<span class="${n<=m.step?'on':''}"></span>`).join('')}</div>`;
  if(m.step===0)body+=[['local','Create a VM on this PC','Use local Hyper-V resources.'],['host','Use a remote host','Connect to a Construct host and create a VM.'],['existing','Register an existing VM','Bring a machine you already use into Companion.']].map(([v,t,d])=>`<label class="choice"><input type="radio" name="setup" value="${v}" ${m.setup===v?'checked':''}><span><strong>${t}</strong><small>${d}</small></span></label>`).join('');
  if(m.step===1)body+=m.setup==='local'?`<div class="notice"><div><strong>Local Hyper-V is available</strong><p>Sample prerequisite check passed.</p></div></div><label class="field">Machine name<input value="new-workspace" id="setupName"></label><div class="grid2"><label class="field">Memory<select><option>8 GB</option><option>16 GB</option></select></label><label class="field">CPU cores<select><option>4 cores</option><option>8 cores</option></select></label></div>`:`<label class="field">${m.setup==='host'?'Host address':'VM address'}<input id="setupAddress" placeholder="${m.setup==='host'?'https://host.example.com':'vm.example.com'}" value="${m.setup==='host'?'https://host.example.com':'vm.example.com'}"></label><div class="notice"><div><strong>Verify & connect</strong><p>${m.setup==='host'?'Confirm the host fingerprint, then sign in.':'Verify the SSH host, then register this machine.'} This prototype uses a sample connection.</p></div></div>`;
  if(m.step===2)body+=`<p class="muted" style="font-size:12px;margin-bottom:14px">Install a reusable profile, or start with an empty workspace.</p><label class="choice"><input type="radio" name="setupProject" value="web-app" checked><span><strong>web-app</strong><small>2 repositories · Node.js · 3 MCP servers</small></span></label><label class="choice"><input type="radio" name="setupProject" value="empty"><span><strong>Empty workspace</strong><small>Add a project later.</small></span></label>`;
  if(m.step===3)body+=`<div class="empty">${I('check')}<h2>Ready to open</h2><p>${m.setup==='local'?'Local VM created':m.setup==='host'?'Host connected':'VM registered'} in this demo.</p></div>`;
  footer=m.step===3?B('Open workspace','finish-onboarding','primary'):B(m.step?'Back':'Cancel',m.step?'wizard-back':'close','quiet')+B(m.step===2?'Finish setup':'Continue','setup-next','primary');
 }
 else if(m.kind==='secret'){
  const s=m.draft||state.secrets.find(x=>x.name===m.name)||{name:'',desc:'',auto:false};title=m.name?s.name:'Add a secret';sub='Secret values open in a protected native Companion dialog.';

 }
 else if(m.kind==='edit-project'){

 }
 else if(m.kind==='choose-machine'){

 }
 else if(m.kind==='scrub'){
  title='Review a saved copy';sub='Access ended. A file still contains the secret.';body=`<div class="secret-chip"><div><strong class="mono">/tmp/deploy.env</strong><small>${state.vm} · matched deploy-key</small></div></div><p class="muted gap" style="font-size:12px">Choose what happens to this file. Agent logs are redacted automatically.</p>`;footer=B('Keep file','scrub-keep','quiet')+B('Delete file','scrub-delete','danger')+B('Redact secret','scrub-redact','primary');
 }
 else if(m.kind==='confirm'){
  title=m.title;sub=m.description;body=m.body||'';footer=B('Cancel','close','quiet')+B(m.confirm||'Confirm','confirm-action',m.danger?'danger':'primary');
 }
 else if(m.kind==='form'){
  title=m.title;sub=m.description||'';body=m.body;footer=B('Cancel','close','quiet')+B(m.confirm||'Save','save-form','primary');
 }
 else {title=m.title;sub=m.description||'';body=m.body||'';footer=B('Done','close','primary');}
 return `<div class="dialog-layer"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="row between"><span class="eyebrow">${eyebrow||'Companion · prototype'}</span><button class="iconbtn" data-action="close" aria-label="Close dialog">${I('close')}</button></div><h2 id="dialogTitle">${title}</h2>${sub?`<p>${sub}</p>`:''}<div class="gap">${body}</div>${footer?`<div class="dialog-footer">${footer}</div>`:''}</section></div>`;
}
function searchResults(query){const items=[['Overview','home','home'],['Projects','projects','folder'],['Machines','machines','machine'],['Key vault','vault','key'],['Requests','inbox','bell'],['VM resources','vmsettings','settings'],['PC preferences','settings','settings'],['Hosts & users','hosts','host'],['Connections','connections','link'],['Usage','usage','chart'],['Updates','updates','update'],['Tray & setup','tray','tray']];const filtered=items.filter(([t])=>t.toLowerCase().includes(query.toLowerCase()));return filtered.length?filtered.map(([t,p,i])=>`<button class="list-row" data-page="${p}">${I(i)}<span class="grow">${t}</span>${I('arrow')}</button>`).join(''):'<p class="muted">No matching pages.</p>'}
function go(page){state.page=page;state.modal=null;render()}
function show(m){lastFocus=document.activeElement;state.modal=m;render();requestAnimationFrame(()=>{const d=document.querySelector('.dialog');d?.querySelector('input,select,button')?.focus({preventScroll:true})})}
function close(){state.modal=state.modal?.returnTo||null;render();document.querySelector('.content button,.titlebar button')?.focus({preventScroll:true})}
function toast(message){clearTimeout(toastTimer);document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;document.getElementById('app').appendChild(el);toastTimer=setTimeout(()=>el.remove(),4500)}
function log(message){state.activity.unshift(message)}
function info(title,description,body=''){show({kind:'info',title,description,body})}
function form(title,body,description='',confirm='Save'){show({kind:'form',title,body,description,confirm})}
function confirm(title,description,act,danger=false,button='Confirm',body=''){show({kind:'confirm',title,description,act,danger,confirm:button,body})}
function action(a){
 const direct=['home','projects','project','machines','connections','vmsettings','vault','inbox','settings','hosts','usage','updates','activity','tray','more'];if(direct.includes(a)){go(a);return}
 const simple={
  launch:['Open T3 Code','In the Companion, this opens the paired T3 Desktop workspace for '+state.vm+'.','<div class="secret-chip">'+I('box')+'<div><strong>'+state.project+'</strong><small>'+state.vm+' · paired and ready</small></div></div>'],
  'launch-vscode':['Open VS Code','Connect to '+state.vm+' over Remote SSH and open the selected project.'],
  'open-preview':['Web preview','A running service would open in your browser.','<div class="secret-chip">'+I('link')+'<div><strong>Web preview</strong><small>Local port 5173 · '+state.vm+' · saved in web-app</small></div></div>'],
  terminal:['Machine console','The Companion opens the console for '+state.vm+'.','<div class="panel soft mono">Connected to '+state.vm+'<br>Ubuntu · console ready<br><br>root@'+state.vm+':~$ <span class="muted">▌</span></div>'],
  'native-secret':['Protected secret entry','The real Companion opens its native secret dialog. This mockup keeps values out of the page.','<div class="panel soft"><strong>Secret value</strong><p class="muted gap">••••••••••••••••</p><p class="muted gap" style="font-size:11px">Example only. Return to the vault to edit metadata.</p></div>'],
  'pair-device':['Pair a device','Companion opens a native pairing dialog with the host approval address and a QR code.','<div class="panel soft"><strong>Pair with primary-host</strong><p class="muted gap" style="font-size:12px">Phone approvals stay on the host service. The real pairing code and device token never enter this page.</p></div>'],
  'vault-key':['Vault key','Companion shows the vault key in a protected native dialog. No key is included in this prototype.'],
  'import-key':['Import vault key','A native dialog accepts the key from your other PC, then syncs the encrypted vault.'],
  logs:['Companion logs','Sample connection and job output.','<div class="panel soft mono">[info] Host reachable<br>[info] dev-main connected<br>[info] Profiles synchronized<br>[info] 2 forwards ready<br>[info] No active jobs</div>'],
  diagnostics:['Connection diagnostics','All sample checks passed.','<div class="stack">'+['Companion runtime','Host connection','VM SSH connection','Port forwards','Desktop integration'].map(x=>'<div class="row between"><span>'+x+'</span>'+badge('Passed','good')+'</div>').join('')+'</div>'],
  'version-detail':['Component version','This component is current.','<div class="setting"><span>Channel</span><span>Stable</span></div><div class="setting"><span>Target</span><span>'+state.vm+'</span></div>'],
  'media-detail':['Installation image','Construct Ubuntu is available for primary VMs.','<div class="setting"><span>Storage</span><span>primary-host</span></div><div class="setting"><span>Status</span>'+badge('Ready','good')+'</div>'],
  'notify-preview':['Agent finished','The web-app build has completed on '+state.vm+'.','<div class="panel soft"><strong>Build complete</strong><p class="muted gap" style="font-size:12px">Open T3 Code to review the result.</p></div>']
 };
 if(simple[a]){const back=state.modal;if(a==='native-secret'&&back?.kind==='secret'){back.draft={name:document.getElementById('secretName').value,desc:document.getElementById('secretDescription').value,auto:document.getElementById('autoApprove').checked}}info(...simple[a]);if(a==='native-secret')state.modal.returnTo=back;return}
 switch(a){
 case 'reset':{const design=state.design;state=initial();state.design=design;render();toast('Sample data reset');break}
 case 'search':show({kind:'search'});break;
 case 'close':close();break;
 case 'machine-details':state.vmTab='overview';go('vmsettings');break;
 case 'active-access':state.vaultTab='access';go('vault');break;
 case 'vault-requests':state.vaultTab='requests';go('vault');break;
 case 'choose-machine':show({kind:'choose-machine'});break;
 case 'add-secret':show({kind:'secret'});break;
 case 'edit-secret':show({kind:'secret',name:'deploy-key'});break;
 case 'save-secret':{
  const name=document.getElementById('secretName').value.trim(),desc=document.getElementById('secretDescription').value.trim(),auto=document.getElementById('autoApprove').checked;
  if(!name){toast('Enter a name for this secret.');return}
  const old=state.secrets.find(s=>s.name===state.modal.name);
  if(state.secrets.some(s=>s.name===name&&s!==old)){toast('A secret with that name already exists.');return}
  const save={name,desc,auto,oldName:old?.name};
  if(auto&&!old?.auto){show({kind:'confirm',title:'Allow reads without approval?',description:'Agents can read '+name+' at any time. Access has no expiry and does not trigger cleanup.',confirm:'Enable auto-approve',act:'auto-secret',save});return}
  commitSecret(save);break;
 }
 case 'new-project':show({kind:'edit-project',isNew:true});break;
 case 'edit-project':show({kind:'edit-project'});break;
 case 'save-project':{
  const name=document.getElementById('projectName').value.trim();if(!/^[a-z0-9][a-z0-9-]*$/.test(name)){toast('Use a project name with lowercase letters, numbers and hyphens.');return}state.project=name;if(!state.projects.includes(name))state.projects.push(name);state.projectSaved=true;log('Project profile saved: '+name);go('project');toast('Profile saved in this demo');break;
 }
 case 'delete-project':confirm('Delete '+state.project+' profile?','This removes the shared profile. Existing repository files on the VM are kept.','delete-project',true,'Delete profile');break;
 case 'rebuild':show({kind:'rebuild',step:0,image:'current',backup:'save'});break;
 case 'wizard-next':if(state.modal.step===0)state.modal.image=document.querySelector('input[name=image]:checked').value;else if(state.modal.step===1)state.modal.backup=document.querySelector('input[name=backup]:checked').value;state.modal.step++;render();break;
 case 'wizard-back':state.modal.step--;render();break;
 case 'confirm-rebuild':if(document.getElementById('confirmVm').value!==state.vm){toast('Type '+state.vm+' to continue.');return}log('Rebuild queued for '+state.vm+' · sample job');state.modal.step=3;render();break;
 case 'finish-rebuild':go('activity');break;
 case 'reprovision':confirm('Reprovision '+state.vm+'?','Apply saved profiles and service settings. Keep the existing VM disk and project files.','reprovision',false,'Run setup','<div class="panel soft"><div class="row between"><span>Target</span><strong>'+state.vm+'</strong></div><p class="muted gap" style="font-size:12px">Setup commands run again and install or update the configured tools.</p></div>');break;
 case 'save-hardware':{
  const ram=document.getElementById('ram'),cpu=document.getElementById('cpu');if(!ram.reportValidity()||!cpu.reportValidity())return;if(!ram.value||!cpu.value){toast('Enter memory and processor values.');return}state.ram=ram.value;state.cpu=cpu.value;state.hardwarePending=true;log('Hardware settings saved for '+state.vm);render();toast('Saved. Stop and start the VM when ready.');break;
 }
 case 'restart':confirm('Stop and start '+state.vm+'?','This interrupts running sessions and applies pending hardware changes.','restart',false,'Stop & start');break;
 case 'save-idle':{const el=document.getElementById('idle');if(!el.reportValidity())return;state.idle=el.value;log('Idle policy applied to '+state.vm);toast('Idle policy applied immediately');break}
 case 'save-identity':{if(!document.getElementById('gitEmail').reportValidity())return;log('Git identity saved');toast('Saved. Applies on reprovision.');break}
 case 'save-host':log('Host configuration saved');toast('Configuration saved for primary-host');break;
 case 'power':confirm((state.online?'Shut down ':'Start ')+state.vm+'?',state.online?'Running sessions on this VM will stop.':'Start the machine and reconnect its tools.','power',false,state.online?'Shut down':'Start VM');break;
 case 'remove-machine':confirm('Remove '+state.vm+' from this PC?','This forgets its registration and closes its forwards. The VM and its files remain on the host.','remove-machine',true,'Remove registration');break;
 case 'scrub':show({kind:'scrub'});break;
 case 'scrub-keep':case 'scrub-delete':case 'scrub-redact':state.scrubs=0;log('Saved copy reviewed: '+a.slice(6));close();toast('Cleanup decision recorded');break;
 case 'onboarding':case 'new-vm':show({kind:'onboarding',step:0,setup:'local'});break;
 case 'new-host':show({kind:'onboarding',step:1,setup:'host'});break;
 case 'connect-existing':show({kind:'onboarding',step:1,setup:'existing'});break;
 case 'setup-next':if(state.modal.step===0)state.modal.setup=document.querySelector('input[name=setup]:checked').value;state.modal.step++;render();break;
 case 'finish-onboarding':state.onboarded=true;log('New workspace connected · sample setup');go('home');break;
 case 'host-setup':confirm('Share this PC as a host','Review the service installation, then explicitly finish conversion to adopt your existing VM.','host-setup',false,'Review host setup','<div class="panel soft"><div class="setting"><span>Existing VM</span><span>local-sandbox</span></div><div class="setting"><span>Your role</span><span>Administrator</span></div><p class="muted gap" style="font-size:12px">VM data and settings are retained during adoption.</p></div>');break;
 case 'sync':info('Profile sync & sharing','Profiles sync through a configuration repository.','<div class="setting"><div><strong>config-profiles</strong><p class="muted" style="font-size:11px">https://example.com/team/config.git</p></div>'+badge('In sync','good')+'</div><div class="row wrap gap">'+B('Sync now','sync-profiles','small')+B('Add remote','add-remote','small')+B('Import','import-profiles','small')+B('Publish profiles','publish-profiles','small')+'</div>');break;
 case 'sync-profiles':case 'sync-vault':log(a==='sync-vault'?'Vault synchronized with primary-host':'Project profiles synchronized');toast('Sync complete');break;
 case 'add-remote':form('Add configuration remote','<label class="field">Repository URL<input type="url" value="https://example.com/team/config.git"></label>','Link a repository to share project profiles.');break;
 case 'publish-profiles':confirm('Publish project profiles?','Push the selected project profiles to the configured remote.','publish',false,'Publish');break;
 case 'new-forward':form('Add a port forward','<label class="field">Label<input placeholder="Web preview" required></label><label class="field">VM port<input type="number" value="5173" min="1" max="65535" required></label><label class="choice"><input type="checkbox" checked><span>Save in the current project profile</span></label>','Expose a service from '+state.vm+' on this PC.','Create forward');break;
 case 'proxy':form('T3 Code proxy address','<label class="field">HTTPS address<input type="url" value="https://t3.example.com"></label>','Pairing links will use this address.');break;
 case 'devices':info('Paired approval devices','primary-host · phone approvals','<div class="list-row"><div class="grow"><strong>Personal phone</strong><p>Last used today</p></div>'+B('Revoke','revoke-device','danger small')+'</div><div class="gap">'+B('Pair another phone','pair-device','small')+'</div>');break;
 case 'revoke-device':confirm('Revoke this phone?','The phone will no longer be able to approve requests on primary-host.','revoke-device',true,'Revoke device');break;
 case 'add-user':case 'edit-user':form(a==='add-user'?'Register user':'User allowances','<label class="field">Username<input value="developer"></label><label class="field">Role<select><option>Member</option><option>Administrator</option></select></label><label class="field">Memory allowance in GB<input type="number" value="16" min="2"></label><label class="field">Maximum VMs<input type="number" value="3" min="1"></label>','Host settings and tokens belong to this user.');break;
 case 'licenses':info('Windows licenses','Keys stay in the protected host credential store.','<div class="list-row"><div class="grow"><strong>Windows test pool</strong><p>1 key available · 0 assignments</p></div>'+B('Assign','assign-license','small')+'</div>');break;
 case 'assign-license':form('Assign a Windows license','<label class="field">Virtual machine<select><option>test-lab</option></select></label>','Choose a compatible guest.','Assign');break;
 case 'media-cleanup':confirm('Remove unused media?','The Windows evaluation image is not bound to a VM. This removes its stored ISO.','media-cleanup',true,'Remove image');break;
 case 'update-detail':confirm(state.updated?'Companion is current':'Update Companion',state.updated?'The stable channel is already installed.':'Install the latest stable Companion on this PC. Its connection will restart.','update',false,state.updated?'Done':'Install update');break;
 case 'export-project':case 'export-config':case 'export-usage':info(a==='export-usage'?'Export usage':a==='export-project'?'Export project':'Export configuration','The Companion opens a save-file dialog. This prototype does not export real data.','<div class="secret-chip">'+I('update')+'<strong class="mono">'+(a==='export-usage'?'usage.json':a==='export-project'?state.project+'.json':'construct-backup.zip')+'</strong></div>');break;
 case 'import-profiles':form('Import project profiles','<label class="field">Source<select><option>Linked configuration repository</option><option>Local profile file</option></select></label><label class="choice"><input type="checkbox" checked><span>design-system</span></label>','Review incoming profiles before adding them.','Import');break;
 case 'save-form':{const invalid=[...document.querySelectorAll('.dialog input')].find(i=>!i.checkValidity());if(invalid){invalid.reportValidity();return}const title=state.modal.title;log(title+' · saved in demo');close();toast(title+' saved in this demo');break}
 case 'confirm-action':executeConfirm();break;
 default:toast('This control is a design example.');
 }
}
function commitSecret(s){const index=state.secrets.findIndex(x=>x.name===s.oldName);const secret={name:s.name,desc:s.desc,auto:s.auto};if(index>=0)state.secrets[index]=secret;else state.secrets.push(secret);log('Secret metadata saved: '+s.name);state.modal=null;state.page='vault';state.vaultTab='secrets';render();toast('Secret metadata saved in this demo')}
function executeConfirm(){const m=state.modal;switch(m.act){
 case 'auto-secret':commitSecret(m.save);return;
 case 'restart':state.hardwarePending=false;state.online=true;state.vmStates[state.vm]=true;log('VM restarted with new hardware settings');break;
 case 'power':state.online=!state.online;state.vmStates[state.vm]=state.online;log(state.vm+(state.online?' started':' shut down'));break;
 case 'reprovision':state.projectSaved=false;log('Reprovision completed · sample job');break;
 case 'update':state.updated=true;log('Companion updated · sample job');break;
 case 'delete-project':state.projects=state.projects.filter(p=>p!==state.project);state.page='projects';log('Project profile deleted: '+state.project);break;
 case 'remove-machine':state.machineNames=state.machineNames.filter(n=>n!==state.vm);state.page='machines';log('Machine registration removed · sample action');break;
 case 'revoke':{const l=state.leases.splice(m.index,1)[0];state.scrubs++;log('Access revoked: '+l.secret);break}
 case 'host-setup':show({kind:'confirm',title:'Ready to finish host conversion',description:'Service setup is complete in this demo. Finish explicitly to adopt local-sandbox as a hosted VM.',act:'finish-host',confirm:'Finish conversion'});return;
 default:log(m.title+' · sample action completed');
 }state.modal=null;render();toast('Completed in this demo');}
document.addEventListener('click',event=>{
 const el=event.target.closest('button');if(!el)return;
 if(el.dataset.design){state.design=el.dataset.design;state.modal=null;render();return}
 if(el.dataset.page){if(el.dataset.page==='vmsettings')state.vmTab='resources';go(el.dataset.page);return}
 if(el.dataset.action){action(el.dataset.action);return}
 if(el.dataset.project){state.project=el.dataset.project;go('project');return}
 if(el.dataset.vm){state.vm=el.dataset.vm;state.online=!!state.vmStates[state.vm];state.vmTab='overview';if(state.design==='fleet'&&['home','machines'].includes(state.page)){state.modal=null;render()}else go('vmsettings');return}
 if(el.dataset.secret){show({kind:'secret',name:el.dataset.secret});return}
 for(const [attr,key] of [['vaultTab','vaultTab'],['settingsTab','settingsTab'],['hostTab','hostTab'],['vmTab','vmTab'],['period','period']])if(el.dataset[attr]){state[key]=el.dataset[attr];render();return}
 if(el.dataset.toggle){const k=el.dataset.toggle;if(k.startsWith('service-')){const next=el.getAttribute('aria-checked')!=='true';el.setAttribute('aria-checked',next);toast('Saved for the next reprovision');return}state[k]=!state[k];render();toast('Preference applied');return}
 if(el.dataset.approve||el.dataset.deny){const id=Number(el.dataset.approve||el.dataset.deny);const r=state.requests.find(x=>x.id===id);if(!r)return;state.requests=state.requests.filter(x=>x.id!==id);if(el.dataset.approve)state.leases.push({secret:r.secret,vm:r.vm,time:r.duration+' remaining'});log((el.dataset.approve?'Approved':'Denied')+' '+r.secret+' for '+r.vm);render();toast(el.dataset.approve?'Access granted in this demo':'Request denied');return}
 if(el.dataset.revoke!==undefined){const index=Number(el.dataset.revoke);const l=state.leases[index];show({kind:'confirm',title:'Revoke '+l.secret+'?',description:'End access on '+l.vm+' now and check for saved copies.',act:'revoke',index,confirm:'Revoke access',danger:true});}
});
document.addEventListener('change',e=>{if(e.target.id==='vmSelect'){state.vm=e.target.value;state.online=!!state.vmStates[state.vm];render()}if(e.target.id==='themeSelect'){state.design=e.target.value;render()}if(e.target.dataset.pref)toast('Preference saved in this demo')});
document.addEventListener('input',e=>{if(e.target.id==='secretSearch')document.getElementById('secretRows').innerHTML=secretRows(e.target.value);if(e.target.id==='globalSearch')document.getElementById('searchResults').innerHTML=searchResults(e.target.value)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){e.preventDefault();close()}if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();show({kind:'search'})}if(e.key==='Tab'&&state.modal){const items=[...document.querySelectorAll('.dialog button,.dialog input,.dialog select')].filter(el=>!el.disabled);if(!items.length)return;const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();
</script>
